name: Diagnose mini app deployment
# Manually-triggered maintenance probe. Reports which UI build the production
# domain serves, and can call the app's own maintenance endpoint (on whichever
# deployment URL is passed in). Contains no secrets — the bot token only ever
# lives in Vercel's environment, where the app reads it.
on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Maintenance endpoint URL to POST (e.g. https://<deployment>/api/admin/refresh-menu?set=none)"
        type: string
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production domain
        run: |
          echo "===================== mortify-pi.vercel.app"
          code=$(curl -sL -o /tmp/page.html -w '%{http_code}' --max-time 20 "https://mortify-pi.vercel.app" || echo fail)
          echo "http_status: $code"
          echo "title: $(grep -o '<title>[^<]*</title>' /tmp/page.html 2>/dev/null | head -1)"
          echo "ui_markers:"
          grep -o 'pnav\|bottom-nav\|Tempted\|Triumph' /tmp/page.html 2>/dev/null | sort | uniq -c || echo "  none found"

      - name: Call maintenance endpoint
        if: ${{ inputs.endpoint != '' }}
        env:
          ENDPOINT: ${{ inputs.endpoint }}
        run: |
          curl -sS -X POST --max-time 30 "$ENDPOINT" | python3 -m json.tool
